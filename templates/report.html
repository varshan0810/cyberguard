{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align: center; padding: 40px;">
    <div style="font-size: 4rem; color: #58a6ff; margin-bottom: 30px; font-weight: bold;">
        {{ score }} / 100
    </div>
    
    <div style="color: #c9d1d9; font-size: 1.1rem; line-height: 1.6; text-align: left; max-width: 600px; margin: 0 auto;">
        {{ summary }}
    </div>
</div>
{% endblock %}
